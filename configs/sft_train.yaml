# SFT training config for Qwen2.5-7B-Instruct + Unsloth LoRA.
# Intended primary runtime: Colab T4 16GB.

model:
  name: "Qwen/Qwen2.5-7B-Instruct"
  max_seq_length: 2048
  dtype: null
  load_in_4bit: true

data:
  train_path: "data/splits/train.jsonl"
  val_path: "data/splits/val.jsonl"
  test_path: "data/splits/test.jsonl"
  text_field: "text"
  max_train_samples: null
  max_val_samples: null

output:
  dir: "models/lora_adapters/qwen2_5_7b_sft"
  logging_dir: "models/lora_adapters/qwen2_5_7b_sft/logs"

lora:
  r: 16
  alpha: 16
  dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  use_gradient_checkpointing: true
  random_state: 42

training:
  seed: 42
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  learning_rate: 0.0002
  warmup_ratio: 0.05
  weight_decay: 0.01
  lr_scheduler_type: "cosine"
  optim: "adamw_8bit"
  fp16: true
  bf16: false
  logging_steps: 10
  eval_steps: 100
  save_steps: 100
  save_total_limit: 3
  report_to: "none"

generation_check:
  enabled: true
  sample_count: 5
  max_new_tokens: 512
