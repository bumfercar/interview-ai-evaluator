[project]
name = "ai-interview-evaluator"
version = "0.1.0"
description = "AI 면접 평가 모델 - 멘토-멘티 매칭 플랫폼 AI 파트"
requires-python = ">=3.10"

dependencies = [
    # 데이터 생성
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "tenacity>=8.3.0",
    # 학습
    "datasets>=2.19.0",
    "transformers>=4.40.0",
    "trl<0.9.0",
    "peft<0.12.0",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.43.0",
    # 평가
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.4.0",
    # 백엔드
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
